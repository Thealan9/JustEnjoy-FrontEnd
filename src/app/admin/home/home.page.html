<ion-content>
  <ion-grid *ngIf="stats">
    <ion-row>
      <ion-col size="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Usuarios</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            {{ stats.users }}
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Ingresos</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            ${{ stats.income_month }}
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-list>
    <ion-item *ngFor="let item of activity">
      {{ item.message }}
    </ion-item>
  </ion-list>
</ion-content>
